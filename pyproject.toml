[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaoyan-material-organizer"
version = "0.0.0"
description = "Local kaoyan knowledge-base tooling for Windows and Obsidian."
requires-python = ">=3.10"
dependencies = ["mistralai==2.5.0", "Pillow>=10,<12", "pypdf>=5,<6"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["kaoyan_kb*", "ocr*", "subject_adapters*"]
