interface:
  display_name: "考研资料整理入口"
  short_description: "像老师一样轻量理解目标，并复用本地资料与可视化能力"
  default_prompt: "使用 $kaoyan-material-organizer 像老师一样理解我的自然语言学习目标。教材页码、题号、选项或原文问题的第一项实质动作必须从技能根目录通过绝对路径和 --config 调用 scripts/kb.py，禁止先回答后定位；后续追问继续传入本会话已确认的教材、页码、章节和题号。先核对 runtime_context、page_anchor.match_status 和 request_resolution.exercise_resolution；缺题号时只接受正式题干的 inferred_unique，歧义时只追问题号，不用语义检索或模型知识猜题。教材、讲义、题集、例题或题目照片还必须检查 answer_grounding，只有 exact_answer 且 can_conclude=true 才能输出结论或 AI 补充推导，题目页 exact_evidence 不能代替原书答案。入口失败或状态为 unavailable 时停止教材归因，不搜索其他 .kaoyan-kb、不自动阅图或启动 OCR。当我说“整理今天对话”时，只沉淀本次已确认的学习结果，不建立冗余数据库或无必要持久化。"
