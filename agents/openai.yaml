interface:
  display_name: "考研资料整理入口"
  short_description: "像老师一样轻量理解目标，并复用本地资料与可视化能力"
  default_prompt: "使用 $kaoyan-material-organizer 像老师一样理解我的自然语言学习目标。教材页码或原文问题必须从技能根目录通过绝对路径和 --config 调用 scripts/kb.py，先核对 runtime_context，再核对 page_anchor.match_status；教材、讲义、题集、例题或题目照片还必须检查 answer_grounding，只有 exact_answer 才能输出结论或 AI 补充推导，题目页 exact_evidence 不能代替原书答案。入口失败或状态为 unavailable 时停止教材归因，不搜索其他 .kaoyan-kb、不自动阅图或启动 OCR。当我说“整理今天对话”时，只沉淀本次已确认的学习结果，不建立冗余数据库或无必要持久化。"
